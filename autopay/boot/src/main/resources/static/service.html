<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>서비스(이동전화) 등록</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: "맑은 고딕", "Malgun Gothic", sans-serif;
            background: #f4f5f7; margin: 0; padding: 24px; color: #222;
        }
        .container { max-width: 760px; margin: 0 auto; }
        h1 { font-size: 20px; margin-bottom: 4px; }
        .desc { color: #667; font-size: 13px; margin-bottom: 20px; }
        .card {
            background: #fff; border-radius: 10px; padding: 24px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08); margin-bottom: 20px;
        }
        label { display: block; font-size: 13px; margin: 14px 0 6px; font-weight: 600; }
        input, select {
            width: 100%; padding: 10px; border: 1px solid #d0d3d8;
            border-radius: 6px; font-size: 14px;
        }
        .row { display: flex; gap: 12px; }
        button {
            padding: 10px 14px; color: #fff; border: none; border-radius: 6px;
            font-size: 14px; cursor: pointer;
        }
        button.lookup { width: 100%; background: #64748b; }
        button.lookup:hover { background: #475569; }
        button.submit { width: 100%; margin-top: 22px; background: #2563eb; padding: 12px; font-size: 15px; }
        button.submit:hover { background: #1d4ed8; }
        button.secondary { background: #64748b; }
        .info { margin-top: 10px; padding: 10px 12px; border-radius: 6px; background: #f1f5f9; font-size: 13px; color: #445; }
        .info.ok { background: #e7f6ec; color: #16794c; }
        .info.err { background: #fdecec; color: #b42318; }
        .result { margin-top: 18px; padding: 14px; border-radius: 6px; font-size: 14px; white-space: pre-wrap; display: none; }
        .result.ok { background: #e7f6ec; color: #16794c; display: block; }
        .result.err { background: #fdecec; color: #b42318; display: block; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { border-bottom: 1px solid #eee; padding: 8px 6px; text-align: left; }
        th { background: #f8fafc; color: #445; }
        .toolbar { display: flex; justify-content: space-between; align-items: center; }
        .muted { color: #889; }
        .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 10px; }
        .badge.ac { background: #e7f6ec; color: #16794c; }
        .badge.sp { background: #fff6e5; color: #a15c00; }
        .badge.tg { background: #f1f2f4; color: #667; }
        .act-btn { padding: 4px 10px; font-size: 12px; border-radius: 5px; margin-right: 4px; }
        .act-btn.warn { background: #d97706; }
        .act-btn.ok { background: #16a34a; }
        .act-btn.danger { background: #dc2626; }
    </style>
</head>
<body>
<div class="container">
    <h1>서비스(이동전화) 등록</h1>
    <p class="desc">고객 → 청구계정을 선택해 이동전화 서비스를 등록합니다.
        (서비스관리번호는 1로 시작하는 10자리 자동 채번, 등록 시 상태는 사용중)</p>

    <div class="card">
        <!-- 테넌트ID는 내부 고정값(SKT) -->
        <input type="hidden" id="tenantId" value="SKT">

        <!-- 1) 고객 조회 -->
        <label>고객 주민번호</label>
        <div class="row">
            <div style="flex:2;"><input id="ownerRrn" placeholder="예: 6808231247113"></div>
            <div style="flex:1;"><button class="lookup" onclick="lookupOwner()">고객 조회</button></div>
        </div>
        <input type="hidden" id="customerNo">
        <div id="ownerInfo" class="info">조회된 고객 정보가 여기에 표시됩니다.</div>

        <!-- 2) 청구계정 선택 (고객의 청구계정 목록) -->
        <label>청구계정 선택</label>
        <select id="billingAccountNo">
            <option value="">고객을 먼저 조회하세요</option>
        </select>

        <!-- 3) 서비스번호(대체ID) -->
        <label>서비스번호(전화번호 등) 대체ID</label>
        <input id="serviceNoAltrnateId" placeholder="예: 01012345678 또는 대체ID">

        <button class="submit" onclick="submitForm()">서비스 등록</button>
        <div id="result" class="result"></div>
    </div>

    <div class="card">
        <div class="toolbar">
            <h1 style="font-size:16px;">서비스 목록</h1>
            <button class="secondary" onclick="loadList()">전체 새로고침</button>
        </div>
        <table>
            <thead>
                <tr><th>서비스관리번호</th><th>청구계정번호</th><th>서비스번호</th><th>상태</th><th>관리</th></tr>
            </thead>
            <tbody id="listBody">
                <tr><td colspan="5" class="muted">고객/청구계정 조회 시 해당 청구계정의 서비스가 표시됩니다. 전체 목록은 새로고침.</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    function val(id) { return document.getElementById(id).value; }
    function setInfo(cls, text) {
        const el = document.getElementById('ownerInfo');
        el.className = 'info ' + cls; el.textContent = text;
    }
    function showResult(ok, text) {
        const el = document.getElementById('result');
        el.className = 'result ' + (ok ? 'ok' : 'err'); el.textContent = text;
    }

    // 1) 고객 조회 → 고객번호 확보 → 청구계정 목록 로딩
    async function lookupOwner() {
        const rrn = val('ownerRrn').trim();
        document.getElementById('customerNo').value = '';
        resetBillingOptions('고객을 먼저 조회하세요');
        if (!rrn) { setInfo('err', '주민번호를 입력하세요.'); return; }
        try {
            const res = await fetch('/api/autopay/customers/by-rrn?rrn=' + encodeURIComponent(rrn));
            if (res.ok) {
                const c = await res.json();
                document.getElementById('customerNo').value = c.customerNo;
                setInfo('ok', '고객번호: ' + c.customerNo + ' / 이름: ' + (c.customerNm || '-') +
                    ' / 이동전화: ' + (c.mobilePhno || '-'));
                await loadBillingAccounts(c.customerNo);
            } else {
                setInfo('err', '해당 주민번호의 고객이 없습니다.');
            }
        } catch (e) { setInfo('err', '요청 오류: ' + e.message); }
    }

    function resetBillingOptions(placeholder) {
        const sel = document.getElementById('billingAccountNo');
        sel.innerHTML = '<option value="">' + placeholder + '</option>';
    }

    // 2) 고객의 청구계정 목록 조회 → 콤보 채우기 + 목록 테이블도 갱신
    async function loadBillingAccounts(customerNo) {
        const tenantId = val('tenantId');
        try {
            const res = await fetch('/api/autopay/billing-accounts?tenantId=' +
                encodeURIComponent(tenantId) + '&customerNo=' + encodeURIComponent(customerNo));
            const list = await res.json();
            const sel = document.getElementById('billingAccountNo');
            if (!Array.isArray(list) || list.length === 0) {
                resetBillingOptions('등록된 청구계정이 없습니다 (청구계정 먼저 등록)');
                clearList('선택된 청구계정이 없습니다.');
                return;
            }
            sel.innerHTML = list.map(b =>
                '<option value="' + b.billingAccountNo + '">' + b.billingAccountNo +
                ' (청구주기 ' + (b.billingCycleCode || '-') + ')</option>'
            ).join('');
            // 첫 청구계정의 서비스 목록 표시
            loadServicesByBilling(sel.value);
        } catch (e) {
            resetBillingOptions('청구계정 조회 오류');
        }
    }

    // 청구계정 콤보 변경 시 해당 청구계정의 서비스 목록 표시
    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('billingAccountNo').addEventListener('change', (e) => {
            if (e.target.value) loadServicesByBilling(e.target.value);
        });
    });

    // 3) 서비스 등록
    async function submitForm() {
        const billingAccountNo = val('billingAccountNo');
        if (!val('customerNo')) { alert('먼저 주민번호로 [고객 조회]를 누르세요.'); return; }
        if (!billingAccountNo) { alert('청구계정을 선택하세요. 없으면 청구계정 먼저 등록해야 합니다.'); return; }
        const serviceNo = val('serviceNoAltrnateId').trim();
        if (!serviceNo) { alert('서비스번호(대체ID)를 입력하세요.'); return; }

        const body = {
            tenantId: val('tenantId'),
            billingAccountNo: billingAccountNo,
            serviceNoAltrnateId: serviceNo
        };
        try {
            const res = await fetch('/api/autopay/services', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const data = await res.json();
            if (res.ok) {
                showResult(true, '등록 성공\n서비스관리번호: ' + data.serviceMgmtNo +
                    '\n청구계정번호: ' + data.billingAccountNo +
                    '\n상태: ' + data.serviceStatCd + ' (' + data.serviceStatLabel + ')');
                document.getElementById('serviceNoAltrnateId').value = '';
                loadServicesByBilling(billingAccountNo);
            } else {
                const msg = (data && data.message) ? data.message : ('등록 실패 (' + res.status + ')');
                alert(msg); showResult(false, msg);
            }
        } catch (e) { alert('요청 오류: ' + e.message); }
    }

    // 청구계정 기준 서비스 목록
    async function loadServicesByBilling(billingAccountNo) {
        const tenantId = val('tenantId');
        try {
            const res = await fetch('/api/autopay/services?tenantId=' +
                encodeURIComponent(tenantId) + '&billingAccountNo=' + encodeURIComponent(billingAccountNo));
            const list = await res.json();
            renderList(list, '선택한 청구계정에 등록된 서비스가 없습니다.');
        } catch (e) {
            clearList('조회 오류: ' + e.message);
        }
    }

    // 전체 서비스 목록
    async function loadList() {
        try {
            const res = await fetch('/api/autopay/services');
            const list = await res.json();
            renderList(list, '등록된 서비스가 없습니다.');
        } catch (e) {
            clearList('조회 오류: ' + e.message);
        }
    }

    function renderList(list, emptyMsg) {
        const tbody = document.getElementById('listBody');
        if (!Array.isArray(list) || list.length === 0) { clearList(emptyMsg); return; }
        tbody.innerHTML = list.map(s =>
            '<tr>' +
            '<td>' + s.serviceMgmtNo + '</td>' +
            '<td>' + (s.billingAccountNo || '-') + '</td>' +
            '<td>' + (s.serviceNoAltrnateId || '-') + '</td>' +
            '<td>' + statusBadge(s.serviceStatCd, s.serviceStatLabel) + '</td>' +
            '<td>' + actionButtons(s) + '</td>' +
            '</tr>'
        ).join('');
    }

    function clearList(msg) {
        document.getElementById('listBody').innerHTML =
            '<tr><td colspan="5" class="muted">' + msg + '</td></tr>';
    }

    function statusBadge(cd, label) {
        let cls = 'badge';
        if (cd === 'AC') cls += ' ac';
        else if (cd === 'SP') cls += ' sp';
        else if (cd === 'TG') cls += ' tg';
        return '<span class="' + cls + '">' + (label || cd || '-') + '</span>';
    }

    // 상태별 관리 버튼: AC(정지/해지), SP(재개/해지), TG(없음)
    function actionButtons(s) {
        const no = "'" + s.serviceMgmtNo + "'";
        if (s.serviceStatCd === 'AC') {
            return '<button class="act-btn warn" onclick="act(' + no + ',\'suspend\',\'정지\')">정지</button>' +
                   '<button class="act-btn danger" onclick="act(' + no + ',\'terminate\',\'해지\')">해지</button>';
        }
        if (s.serviceStatCd === 'SP') {
            return '<button class="act-btn ok" onclick="act(' + no + ',\'resume\',\'재개\')">재개</button>' +
                   '<button class="act-btn danger" onclick="act(' + no + ',\'terminate\',\'해지\')">해지</button>';
        }
        return '<span class="muted">-</span>';
    }

    // 상태 변경 실행
    async function act(serviceMgmtNo, action, label) {
        const confirmMsg = (action === 'terminate')
            ? '이 서비스를 해지하시겠습니까? 해지 후 되돌릴 수 없습니다.'
            : '이 서비스를 ' + label + '하시겠습니까?';
        if (!confirm(confirmMsg)) return;
        try {
            const res = await fetch('/api/autopay/services/' + encodeURIComponent(serviceMgmtNo) + '/' + action, {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}'
            });
            const data = await res.json().catch(() => ({}));
            if (res.ok) {
                alert(label + ' 완료 (상태: ' + (data.serviceStatLabel || data.serviceStatCd || '') + ')');
                // 현재 선택된 청구계정 기준으로 새로고침, 없으면 전체
                const bno = val('billingAccountNo');
                if (bno) loadServicesByBilling(bno); else loadList();
            } else {
                alert((data && data.message) ? data.message : (label + ' 실패 (' + res.status + ')'));
            }
        } catch (e) { alert('요청 오류: ' + e.message); }
    }
</script>
</body>
</html>
